name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  CSV_URL: "MLproject/advertising_preprocessing.csv"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.5"

      - name: Check env
        run: |
          echo "CSV_URL=$CSV_URL"

      - name: Install MLflow
        run: |
          python -m pip install --upgrade pip
          pip install "mlflow==3.13.0"

      - name: Run MLflow project
        run: |
          mlflow run MLproject \
            --experiment-name "CI-Automated-Runs" \
            --env-manager=conda

      - name: Save mlruns to repo
        if: github.event_name == 'push'
        run: |
          git config --global user.name "${{ secrets.username }}"
          git config --global user.email "${{ secrets.email }}"

          if git diff --quiet -- mlruns; then
            echo "No changes in mlruns/. Skipping commit."
          else
            git add mlruns/
            git commit -m "Save mlruns from CI run"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi